<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  width: 300px;
  font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  padding: 12px;
  background: #1e1f22;
  color: #e3e5e8;
}
h1 {
  font-size: 15px;
  margin: 0 0 10px;
  color: #fff;
}
label {
  font-size: 12px;
  color: #b5bac1;
  display: block;
  margin-top: 10px;
}
textarea {
  width: 100%;
  height: 100px;
  box-sizing: border-box;
  background: #2b2d31;
  color: #e3e5e8;
  border: 1px solid #3f4147;
  border-radius: 6px;
  padding: 6px;
  font-size: 11px;
  font-family: monospace;
  resize: vertical;
}
input[type="file"] {
  font-size: 11px;
  margin-top: 4px;
  color: #b5bac1;
}
input[type="range"] {
  width: 100%;
}
button {
  width: 100%;
  margin-top: 12px;
  padding: 8px;
  background: #5865f2;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}
button:hover { background: #4752c4; }
#status {
  margin-top: 8px;
  font-size: 11px;
  color: #23a559;
  min-height: 14px;
}
#gainValue { color: #fff; font-weight: 600; }
.row { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<h1>Mic EQ Boost - Discord</h1>

<div class="row">
  <label for="gain">Extra boost</label>
  <span id="gainValue">0 dB</span>
</div>
<input type="range" id="gain" min="-20" max="30" step="0.5" value="0">

<label for="fileInput">Upload AutoEq / EQ APO .txt</label>
<input type="file" id="fileInput" accept=".txt">

<label for="fileInput2">Upload additional AutoEq / EQ APO .txt</label>
<input type="file" id="fileInput2" accept=".txt">

<label for="eqText">...or paste filter text</label>
<textarea id="eqText" placeholder="Preamp: -6.6 dB&#10;Filter 1: ON PK Fc 105 Hz Gain -2.5 dB Q 1.41"></textarea>

<button id="saveBtn">Apply</button>
<div id="status"></div>

<script src="popup.js"></script>
</body>
</html>
